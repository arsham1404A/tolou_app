 {% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تئاتر طلوع | حمایت مالی</title>
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: radial-gradient(circle at center, rgba(18, 43, 32, 0.4) 0%, rgba(0, 0, 0, 0.95) 100%);
            perspective: 1000px; /* بستر افکت سه‌بعدی */
            overflow-x: hidden;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            background: rgba(9, 14, 11, 0.9);
            border: 1px solid rgba(82, 183, 136, 0.35);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(82, 183, 136, 0.15);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 25px 60px rgba(0,0,0,0.95), 0 0 40px rgba(82, 183, 136, 0.3);
            border-color: #52B788;
        }

        .page-title {
            font-size: 20px;
            color: #E5C583;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 0 12px rgba(229, 197, 131, 0.4);
            transform: translateZ(20px);
        }

        /* استایل عکس کارت با قابلیت حرکت ۳بعدی و بدون بک‌گراند */
        .card-img-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            transform: translateZ(35px); /* برجسته‌تر شدن کارت نسبت به بقیه اجزا */
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.8));
            transition: transform 0.3s ease;
        }
        
        .card-img {
            width: 100%;
            max-width: 380px;
            height: auto;
            border-radius: 16px;
            object-fit: contain;
            border: 1px solid rgba(229, 197, 131, 0.2);
        }

        /* بخش دکمه کپی شماره کارت */
        .copy-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
            transform: translateZ(15px);
        }

        .card-number-text {
            font-size: 18px;
            letter-spacing: 3px;
            color: #52B788;
            font-weight: 700;
            background: #122B20;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px dashed rgba(82, 183, 136, 0.5);
            width: 100%;
            max-width: 320px;
        }

        .copy-btn {
            background: linear-gradient(135deg, #059669, #52B788);
            color: #000;
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 20px rgba(82, 183, 136, 0.4);
            width: 100%;
            max-width: 300px;
            justify-content: center;
        }

        .copy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(229, 197, 131, 0.7);
            background: #E5C583;
            color: #000;
        }
 .back-link {
            color: #94A3B8;
            text-decoration: none;
            font-size: 13px;
            margin-top: 10px;
            transition: color 0.3s;
            transform: translateZ(10px);
        }
        .back-link:hover {
            color: #E5C583;
            text-shadow: 0 0 8px rgba(229, 197, 131, 0.4);
        }
    </style>
</head>
<body>

    <div class="container" id="tiltCard">
        <h2 class="page-title">حمایت مالی از گروه فرهنگی هنری طلوع ⚡️</h2>

        <!-- عکس کارت بانکی شناور -->
        <div class="card-img-wrapper">
            <img src="{% static 'images/card.png' %}" alt="کارت بانکی" class="card-img" id="cardImage">
        </div>

        <!-- دکمه کپی شماره کارت -->
        <div class="copy-section">
            <span class="card-number-text" id="cardNumber">6104338673743064</span>
            
            <button class="copy-btn" onclick="copyCardNumber()">
                📋 کپی کردن شماره کارت
            </button>
        </div>

        <a href="{% url 'home' %}" class="back-link">← بازگشت به صفحه اصلی</a>
    </div>

    <!-- اسکریپت پیشرفته افکت سه‌بعدی و کپی شماره کارت -->
    <script>
        function copyCardNumber() {
            const cardNum = "6104338673743064"; // شماره کارت دقیق و درست
            navigator.clipboard.writeText(cardNum).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerHTML = "شماره کارت کپی شد! ✅";
                btn.style.background = "linear-gradient(135deg, #E5C583, #d4a373)";
                
                setTimeout(() => {
                    btn.innerHTML = "📋 کپی کردن شماره کارت";
                    btn.style.background = "linear-gradient(135deg, #059669, #52B788)";
                }, 3000);
            }).catch(err => {
                alert("کپی کردن با خطا مواجه شد.");
            });
        }

        // افکت سه‌بعدی Tilt Effect برای باکس و کارت
        const container = document.getElementById('tiltCard');

        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 20;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 20;
            
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg);`
        });

        document.addEventListener('mouseleave', () => {
            container.style.transform =` rotateY(0deg) rotateX(0deg);`
            container.style.transition = 'transform 0.5s ease';
        });

        container.addEventListener('mouseenter', () => {
            container.style.transition = 'none';
        });
    </script>

</body>
</html>
