 {% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کمک به گروه تئاتر طلوع</title>
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .page-title {
            font-size: 18px;
            color: #E5C583;
            font-weight: 700;
            margin-bottom: 5px;
        }

        /* استایل عکس کارت بدون بک‌گراند اضافی */
        .card-img-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .card-img {
            width: 100%;
            max-width: 420px;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(82, 183, 136, 0.2);
            border: 1px solid rgba(82, 183, 136, 0.4);
            object-fit: contain;
        }

        /* بخش دکمه کپی شماره کارت */
        .copy-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        .card-number-text {
            font-size: 16px;
            letter-spacing: 2px;
            color: #52B788;
            font-weight: 600;
        }

        .copy-btn {
            background: linear-gradient(135deg, #52B788, #2d6a4f);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 20px rgba(82, 183, 136, 0.3);
            width: 100%;
            max-width: 300px;
            justify-content: center;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(82, 183, 136, 0.5);
            background: linear-gradient(135deg, #74c69d, #52B788);
        }

        .back-link {
            color: #94A3B8;
            text-decoration: none;
            font-size: 13px;
            margin-top: 15px;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="page-title">حمایت مالی از گروه فرهنگی هنری طلوع ⚡️</h2>

        <!-- عکس کارت بانکی -->
        <div class="card-img-wrapper">
            <img src="{% static 'images/card.png' %}" alt="کارت بانکی ملت" class="card-img" id="cardImage">
        </div>

        <!-- دکمه کپی شماره کارت -->
        <div class="copy-section">
            <!-- شماره کارت رو دقیق اینجا نوشتم تا قابل کپی باشه -->
            <span class="card-number-text" id="cardNumber">6104-6104-6104-6104</span>
            
            <button class="copy-btn" onclick="copyCardNumber()">
                📋 کپی کردن شماره کارت
            </button>
        </div>

        <a href="{% url 'home' %}" class="back-link">← بازگشت به صفحه اصلی</a>
    </div>
 <script>
        function copyCardNumber() {
            // شماره کارت بدون خط تیره یا با خط تیره (هر مدلی که راحت تری، اینجا متن داخل span رو می‌گیره)
            const cardNum = "6104610461046104"; // بدون فاصله یا خط تیره برای واریز راحت‌تر
            navigator.clipboard.writeText(cardNum).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerHTML = "شماره کارت کپی شد! ✅";
                btn.style.background = "linear-gradient(135deg, #E5C583, #d4a373)";
                
                setTimeout(() => {
                    btn.innerHTML = "📋 کپی کردن شماره کارت";
                    btn.style.background = "linear-gradient(135deg, #52B788, #2d6a4f)";
                }, 3000);
            }).catch(err => {
                alert("کپی کردن با خطا مواجه شد.");
            });
        }
    </script>

</body>
</html>
