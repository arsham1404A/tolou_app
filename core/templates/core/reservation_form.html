 {% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه جامع تئاتر طلوع | رزرو اجرا</title>
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background: url('{% static "images/reservation_bg.jpg" %}') no-repeat center center/cover;
            position: relative;
            perspective: 1000px; /* تنظیم بستر پرسپکتیو برای افکت ۳D */
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(9, 14, 11, 0.75) 0%, rgba(0, 0, 0, 0.92) 100%);
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        /* کانتینر اصلی با قابلیت چرخش ۳بعدی و انیمیشن ورود */
        .form-container {
            position: relative;
            z-index: 2;
            background: rgba(9, 14, 11, 0.94);
            border: 1px solid rgba(82, 183, 136, 0.5);
            padding: 40px 35px;
            border-radius: 24px;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95), 0 0 25px rgba(82, 183, 136, 0.2);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .form-container:hover {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(82, 183, 136, 0.35);
            border-color: #52B788;
        }

        .form-container h2 {
            font-size: 24px;
            color: #E5C583;
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 0 0 12px rgba(229, 197, 131, 0.4);
            transform: translateZ(20px); /* برجسته‌سازی متن در فضای ۳بعدی */
        }

        .form-group {
            margin-bottom: 20px;
            transform: translateZ(10px);
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #CBD5E1;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            background: #122B20;
            border: 1px solid rgba(82, 183, 136, 0.4);
            color: #fff;
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #E5C583;
            box-shadow: 0 0 15px rgba(229, 197, 131, 0.4);
            background: #18382b;
            transform: translateY(-2px);
        }

        .form-group textarea {
            resize: vertical;
            height: 90px;
        }
 .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #059669, #52B788);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 5px 20px rgba(82, 183, 136, 0.4);
            transform: translateZ(15px);
        }

        .submit-btn:hover {
            background: #E5C583;
            color: #000;
            box-shadow: 0 0 25px rgba(229, 197, 131, 0.7);
            transform: translateY(-3px) translateZ(15px);
        }

        .notice-text {
            text-align: center;
            font-size: 12px;
            color: #94A3B8;
            margin-top: 22px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #94A3B8;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }
        .back-link:hover {
            color: #E5C583;
            text-shadow: 0 0 10px rgba(229, 197, 131, 0.5);
        }
    </style>
</head>
<body>

    <div class="form-container" id="formContainer">
        <h2>فرم درخواست رزرو اجرا 🎭</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>نام و نام خانوادگی:</label>
                <input type="text" name="full_name" required placeholder="مثال: علی رضایی">
            </div>

            <div class="form-group">
                <label>شماره همراه:</label>
                <input type="text" name="phone" required placeholder="09123456789">
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label>استان:</label>
                    <input type="text" name="province" required placeholder="مثال: خراسان رضوی">
                </div>
                <div>
                    <label>شهر:</label>
                    <input type="text" name="city" required placeholder="مثال: سبزوار">
                </div>
            </div>

            <div class="form-group">
                <label>آدرس دقیق محل مورد نظر:</label>
                <textarea name="address" required placeholder="استان، شهر، خیابان، پلاک، سالن یا مسجد..."></textarea>
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label>ظرفیت صوت مکان:</label>
                    <select name="sound_capacity">
                        <option value="ندارد">ندارد</option>
                        <option value="ضعیف">ضعیف</option>
                        <option value="خوب">خوب</option>
                        <option value="خیلی خوب">خیلی خوب</option>
                    </select>
                </div>
                <div>
                    <label>ظرفیت نور:</label>
                    <select name="light_capacity">
                        <option value="ندارد">ندارد</option>
                        <option value="ضعیف">ضعیف</option>
                        <option value="خوب" selected>خوب</option>
                        <option value="خیلی خوب">خیلی خوب</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>نمایشنامه مورد نظر برای اجرا:</label>
                <select name="play_title">
                    <option value="یاس پرپر">یاس پرپر</option>
                    <option value="حضرت عباس">حضرت عباس</option>
                    <option value="امام حسین">امام حسین</option>
                    <option value="حضرت علی اکبر">حضرت علی اکبر</option>
                    <option value="حضرت قاسم">حضرت قاسم</option>
                    <option value="حضرت رقیه">حضرت رقیه</option>
                </select>
            </div>
 <div class="form-group">
                <label>مبلغ پیشنهادی شما (به ریال):</label>
                <input type="text" name="offered_price" required placeholder="مثال: 5000000">
            </div>

            <button type="submit" class="submit-btn">ارسال فرم رزرو ⚡️</button>
        </form>

        <p class="notice-text">در صورت تایید با شما تماس گرفته خواهد شد.</p>
        <a href="{% url 'home' %}" class="back-link">← بازگشت به صفحه اصلی</a>
    </div>

    <!-- اسکریپت پیشرفته افکت سه‌بعدی (3D Tilt Effect) -->
    <script>
        const container = document.getElementById('formContainer');

        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            container.style.transform = rotateY(${xAxis}deg) rotateX(${-yAxis}deg);
        });

        // وقتی موس بیرون رفت، فرم به حالت اول برگرده
        document.addEventListener('mouseleave', () => {
            container.style.transform = rotateY(0deg) rotateX(0deg);
            container.style.transition = 'transform 0.5s ease';
        });

        container.addEventListener('mouseenter', () => {
            container.style.transition = 'none';
        });
    </script>

</body>
</html>
